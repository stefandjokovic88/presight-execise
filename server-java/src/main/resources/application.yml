server:
  port: ${PORT:3001}

spring:
  application:
    name: presight-server-java
  main:
    banner-mode: off
  sql:
    init:
      mode: never

app:
  db-path: ${DB_PATH:./data/users.db}
  client-dist: ${CLIENT_DIST:}
  seed-on-empty: true

logging:
  level:
    root: INFO
    com.presight.users: INFO
  pattern:
    # Keep Docker logs readable (one line per event; stack traces still follow errors)
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
